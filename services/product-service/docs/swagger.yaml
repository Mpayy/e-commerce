basePath: /api/v1
definitions:
  apperror.AppError:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.CategoryRequest:
    properties:
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.CategoryResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.MetaPagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductCreateRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      name:
        maxLength: 150
        type: string
      price:
        type: number
      sku:
        maxLength: 50
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - category_id
    - name
    - price
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductResponse:
    properties:
      category_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      slug:
        type: string
      stock:
        type: integer
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductSearchResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductResponse'
        type: array
      meta:
        $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.MetaPagination'
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductStockAdjustmentRequest:
    properties:
      stock:
        minimum: 0
        type: integer
    required:
    - stock
    type: object
  github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductUpdateRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      price:
        type: number
      sku:
        maxLength: 50
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - category_id
    - name
    - price
    type: object
  response.ErrorResponse:
    properties:
      error: {}
      success:
        example: false
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
host: localhost:8081
info:
  contact: {}
  description: Product & Category catalog, backed by MongoDB. Internal gRPC contract
    lives in proto/product/v1.
  title: Product Catalog Service API
  version: "1.0"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      description: Creates a product category and auto-generates its slug from the
        name. Requires admin role. Returns 409 if a category with the same name already
        exists.
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.CategoryResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "403":
          description: FORBIDDEN
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: DUPLICATED_CATEGORY
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new category
      tags:
      - categories
  /admin/products:
    post:
      consumes:
      - application/json
      description: Creates a product under an existing category. Slug is auto-generated
        from the name; SKU is auto-generated if left blank, otherwise the provided
        SKU is sanitized and used as-is. Requires admin role.
      parameters:
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "403":
          description: FORBIDDEN
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: CATEGORY_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: DUPLICATED_PRODUCT / DUPLICATED_PRODUCT_SKU
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new product
      tags:
      - products
  /admin/products/{product_id}:
    delete:
      description: Deactivates a product by setting is_active to false instead of
        removing the row, so past order history referencing this product remains intact.
        Requires admin role.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Product deleted successfully
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: BAD_REQUEST
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "403":
          description: FORBIDDEN
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Soft-delete a product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates all fields of a product, including its active status. The
        category is re-validated only if category_id is changed. Requires admin role.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "403":
          description: FORBIDDEN
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: PRODUCT_NOT_FOUND / CATEGORY_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: DUPLICATED_PRODUCT / DUPLICATED_PRODUCT_SKU
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Update an existing product
      tags:
      - products
  /admin/products/{product_id}/adjust-stock:
    patch:
      description: Overwrites the product's stock to the given absolute value (not
        a delta), typically used to reconcile stock after a physical count. Requires
        admin role.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Stock adjustment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductStockAdjustmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Product stock adjusted successfully
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: BAD_REQUEST / VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "403":
          description: FORBIDDEN
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Set a product's stock quantity
      tags:
      - products
  /categories:
    get:
      description: Returns every product category. This endpoint is public and does
        not require authentication.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.CategoryResponse'
                  type: array
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      summary: List all categories
      tags:
      - categories
  /products:
    get:
      description: Returns a paginated, publicly accessible list of active products,
        optionally filtered by name (partial match) and category_id. A category_id
        that matches no products returns an empty list, not a 404.
      parameters:
      - description: Search by product name
        in: query
        name: search
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductSearchResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      summary: Search and list products
      tags:
      - products
  /products/{product_id}:
    get:
      description: Returns a single product by ID. Inactive or non-existent products
        both return 404, so publicly disabled products are indistinguishable from
        products that were never created. This endpoint is public.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Mpayy_e-commerce_services_product-service_internal_product_dto.ProductResponse'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      summary: Get product detail
      tags:
      - products
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
