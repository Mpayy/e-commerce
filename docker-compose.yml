services:
  app:
    build:
      context: .
      dockerfile: ./monolith/Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: [.env]
    environment:
      DATABASE_HOST: postgres 
      REDIS_HOST: redis
      PRODUCT_SERVICE_ADDR: ecommerce-product-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: ./service/product-service/Dockerfile
    container_name: ecommerce-product-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
      MONGODB_DATABASE: ecommerce
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce     
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  mongo:
    image: mongo:8
    container_name: ecommerce-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  mongo-init-replica:
    image: mongo:8
    container_name: ecommerce-mongo-init
    restart: "no"
    networks:
      - ecommerce-network
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval '
        try {
          if (rs.status().ok === 1) {
            console.log("Replica set already initialized.");
          }
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongo:27017" }]
          });
          console.log("Replica set initialized successfully.");
        }
      '

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  ecommerce-network:
    driver: bridge