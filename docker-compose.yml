services:
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    ports:
    - "8080:8080"
    env_file: [.env]
    environment:
      USER_SERVICE_ADDR: http://user-service:8082
      PRODUCT_SERVICE_HTTP_ADDR: http://product-service:8081
      ORDER_SERVICE_ADDR: http://order-service:8083
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    container_name: ecommerce-product-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
      MONGODB_DATABASE: ecommerce
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: ecommerce-user-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: [.env]
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: user_db
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  notification-consumer:
    build:
      context: .
      dockerfile: ./services/notification-consumer/Dockerfile
    container_name: ecommerce-notification-consumer
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/ 
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    container_name: ecommerce-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file: [.env]
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: order_db
      REDIS_HOST: redis
      PRODUCT_SERVICE_ADDR: ecommerce-product-service:50051
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  mongo:
    image: mongo:8
    container_name: ecommerce-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  mongo-init-replica:
    image: mongo:8
    container_name: ecommerce-mongo-init
    restart: "no"
    networks:
      - ecommerce-network
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval '
        try {
          if (rs.status().ok === 1) {
            console.log("Replica set already initialized.");
          }
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongo:27017" }]
          });
          console.log("Replica set initialized successfully.");
        }
      '
  
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && nc -z 127.0.0.1 5672"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ecommerce-network

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  rabbitmq_data:

networks:
  ecommerce-network:
    driver: bridge